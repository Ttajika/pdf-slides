<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFスライド</title>
<!--
  viewer.html — GitHub に置いた PDF をスライドとして表示し、手書き・板書を iPad → PC へライブ配信する

    普通に見る:      viewer.html?file=pdf/xxx.pdf             （#5 で 5 ページ目から）
    配信（iPad）:    viewer.html?file=pdf/xxx.pdf&presenter=1&live=CODE   要ログイン
    受信（PC）:      viewer.html?file=pdf/xxx.pdf&live=CODE
    受信＋録画（PC）: viewer.html?file=pdf/xxx.pdf&live=CODE&rec=1

  ?file を付けずに開くと、手元の PDF を選んで開ける（配信はできない。確認用）。

  座標の決まり（js/slide-live.js と合わせる）:
    ・手書き canvas の内部解像度は幅 CW px に固定（高さ = CW × ページの縦横比）。点はこの px で持つ
    ・板書 canvas は BW × BH px に固定
    ・線の太さ size は「スライド幅 1100px / 板書幅 900px のときの px」。描くときに倍率を掛ける
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/slide-sync.js"></script>
<script src="js/slide-live.js"></script>
<style>
:root { --accent:#e94560; --bar:#1a1a2e; --bg:#eef0f3; --ink:#1f2937; --muted:#6b7280; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.ic { width:1em; height:1em; vertical-align:-0.125em; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; }
.topbar { position:fixed; top:0; left:0; right:0; height:46px; display:flex; align-items:center; gap:10px;
  padding:0 12px; background:var(--bar); color:#fff; z-index:100; }
.topbar a.home { color:#fff; opacity:.75; text-decoration:none; font-size:15px; }
.topbar-title { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.topbar-nav { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.nav-btn, .nav-sel { font:inherit; font-size:13px; color:#fff; background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2); border-radius:5px; padding:4px 9px; cursor:pointer; line-height:1.3; }
.nav-sel { max-width:180px; }
.nav-sel option { color:#000; }
.nav-btn.on { background:var(--accent); border-color:var(--accent); }
#pageInfo { font-size:13px; font-variant-numeric:tabular-nums; min-width:5.5em; text-align:center; }
#drawbar { position:fixed; top:54px; left:12px; z-index:90; display:none; flex-wrap:wrap; gap:5px; align-items:center;
  background:rgba(26,26,46,.94); padding:6px 8px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.2); }
#drawbar.show { display:flex; }
#drawbar button { font:inherit; font-size:13px; background:rgba(255,255,255,.1); color:#fff;
  border:1px solid rgba(255,255,255,.25); border-radius:6px; padding:4px 8px; cursor:pointer; }
#drawbar button.on { background:#fff; color:var(--bar); }
.sw { width:20px; height:20px; padding:0 !important; border-radius:50% !important; border:2px solid rgba(255,255,255,.4) !important; }
.sw.on { border-color:#fff !important; outline:2px solid #fff; }
#stageArea { position:absolute; top:46px; left:0; right:0; bottom:0; }
#stage { position:absolute; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.15); }
#stage canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
#pdfCanvas { z-index:0; }
#drawCanvas { z-index:10; pointer-events:none; }
body.drawing #drawCanvas { pointer-events:auto; cursor:crosshair; }
body.drawing #stage { touch-action:none; }
/* 板書ポップアップ（900×600 固定。画面に収まらない分は transform で縮める）*/
#board { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:300; }
#board.show { display:block; }
#boardInner { position:absolute; left:50%; top:50%; width:900px; height:600px; background:#fff; border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.3); overflow:hidden; transform:translate(-50%,-50%) scale(var(--board-scale,1)); }
#boardHead { height:40px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 14px;
  background:var(--bar); color:#fff; font-size:13px; }
#boardHead .tools { display:flex; gap:6px; align-items:center; }
#boardHead button { font:inherit; font-size:13px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
  color:#fff; border-radius:5px; cursor:pointer; padding:3px 8px; }
#boardHead button.on { background:#fff; color:var(--bar); }
#boardWrap { position:relative; width:900px; height:560px; touch-action:none; }
#boardWrap canvas { position:absolute; top:0; left:0; width:100%; height:100%; cursor:crosshair; }
#opener { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; }
#opener .box { background:#fff; border:2px dashed #c7cbd3; border-radius:14px; padding:32px 28px; max-width:460px;
  text-align:center; line-height:1.8; }
#opener.drag .box { border-color:var(--accent); background:#fff5f7; }
#opener h1 { font-size:18px; margin:0 0 6px; }
#opener label { display:inline-block; margin-top:10px; background:var(--accent); color:#fff; border-radius:8px;
  padding:9px 18px; cursor:pointer; font-weight:700; }
#opener .note { font-size:12.5px; color:var(--muted); margin-top:12px; }
#opener a { color:var(--accent); }
#loading { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); background:rgba(26,26,46,.9); color:#fff;
  padding:10px 18px; border-radius:8px; font-size:14px; display:none; z-index:50; }
#loading.show { display:block; }
@media (max-width: 760px) {
  .topbar-title { display:none; }
  .nav-sel { max-width:110px; }
}
</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="./" title="一覧へ">⌂</a>
  <div class="topbar-title" id="title">PDFスライド</div>
  <div class="topbar-nav">
    <select class="nav-sel" id="secSel" title="セクション" hidden></select>
    <button class="nav-btn" id="prevBtn" title="前へ (←)">◀</button>
    <span id="pageInfo">– / –</span>
    <button class="nav-btn" id="nextBtn" title="次へ (→)">▶</button>
    <button class="nav-btn" id="drawBtn" title="手書き (D)">✏️</button>
    <button class="nav-btn" id="boardBtn" title="板書 (B)">板書</button>
    <button class="nav-btn" id="fsBtn" title="全画面 (F)" hidden>⛶</button>
  </div>
</div>
<div id="drawbar">
  <button data-tool="pen" title="ペン (P)">✏️</button>
  <button data-tool="highlight" title="蛍光ペン (H)">🖍</button>
  <button data-tool="eraser" title="消しゴム (E)">🧽</button>
  <button data-tool="pointer" title="ポインター (L)">🔴</button>
  <button class="sw" data-c="#e94560" style="background:#e94560" title="赤"></button>
  <button class="sw" data-c="#2563eb" style="background:#2563eb" title="青"></button>
  <button class="sw" data-c="#1f2937" style="background:#1f2937" title="黒"></button>
  <button class="sw" data-c="#16a34a" style="background:#16a34a" title="緑"></button>
  <button id="undoBtn" title="取り消し (Ctrl/⌘+Z)">↶</button>
  <button id="clearBtn" title="このページの書き込みを全消去">🗑</button>
</div>
<main id="stageArea">
  <div id="stage" hidden><canvas id="pdfCanvas"></canvas><canvas id="drawCanvas"></canvas></div>
  <div id="opener" hidden>
    <div class="box">
      <h1>PDF を開く</h1>
      <div>手元の PDF をここにドロップするか、選んでください（確認用。配信はできません）。</div>
      <label>PDF を選ぶ<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden></label>
      <div class="note">GitHub の <code>pdf/</code> に置いた PDF は <a href="./">一覧</a> から開けます。</div>
    </div>
  </div>
  <div id="loading"></div>
</main>
<div id="board">
  <div id="boardInner">
    <div id="boardHead">
      <span>板書（ページ <span id="boardPage">1</span>）</span>
      <div class="tools">
        <button class="sw" data-bc="#e94560" style="background:#e94560" title="赤"></button>
        <button class="sw" data-bc="#2563eb" style="background:#2563eb" title="青"></button>
        <button class="sw" data-bc="#1f2937" style="background:#1f2937" title="黒"></button>
        <button class="sw" data-bc="#16a34a" style="background:#16a34a" title="緑"></button>
        <button id="bEraseBtn" title="消しゴム">🧽</button>
        <button id="bUndoBtn" title="取り消し">↶</button>
        <button id="bClearBtn" title="全消去">🗑</button>
        <button id="bCloseBtn" title="閉じる (B / Esc)">✕</button>
      </div>
    </div>
    <div id="boardWrap"><canvas id="boardCanvas"></canvas></div>
  </div>
</div>

<script>
'use strict';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const REF_W = 1100;            // 線の太さ・ポインターの大きさの基準幅（HTML スライドと同じ）
const CW = 2200;               // 手書き canvas の内部幅（px）
const BREF_W = 900, BW = 1800, BH = 1120;   // 板書：基準幅 / canvas の内部サイズ（表示は 900×560）
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let pdf = null, N = 0, current = 0, SECTIONS = [];
let pageAspect = 9 / 16;       // 高さ / 幅
let strokes = {}, boardStrokes = {};   // { ページ番号: [{color,size,alpha,points:[{x,y}]}] }（canvas の px）
let STORAGE_KEY = '', deck = '';
let drawMode = false, drawTool = 'pen', drawColor = '#e94560', penSeen = false, curStroke = null, pointerPos = null;
let boardOpen = false, boardColor = '#1f2937', boardEraser = false, boardCur = null;

function loading(msg) { const el = $('loading'); el.textContent = msg; el.classList.toggle('show', !!msg); }
const deckName = name => name.replace(/\.pdf$/i, '').replace(/[\\/:*?"<>|#%&\s]+/g, '_');

/* ── PDF を開く ──────────────────────────────────────────────────────────── */
async function openPdf(src, fileName, fromRepo) {
  $('opener').hidden = true;
  loading('PDF を読み込み中…');
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    pdf = await pdfjsLib.getDocument(src).promise;
  } catch (e) {
    loading(''); $('opener').hidden = false;
    alert('PDF を開けませんでした：' + (e && e.message || e)); return;
  }
  N = pdf.numPages;
  deck = deckName(fileName);
  document.title = fileName.replace(/\.pdf$/i, '');
  $('title').textContent = document.title;
  STORAGE_KEY = 'pdfslides_' + deck;
  SECTIONS = await readOutline();
  fillSections();
  loadLocal();
  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= N) current = h - 1;
  current = Math.max(0, Math.min(N - 1, current));
  const first = await pdf.getPage(current + 1);
  const vp = first.getViewport({ scale: 1 }); pageAspect = vp.height / vp.width;
  loading('');
  $('stage').hidden = false;
  sizeStage();
  showSlide(current);
  if (!fromRepo) return;   // 手元の PDF は配信しない（受信側が同じ PDF を開けないため）

  // ログイン（配信者の確認だけに使う。書き込みはクラウドに保存しない）
  if (window.SlideSync) SlideSync.init({
    storageKey: STORAGE_KEY, syncData: false,
    getCanvas: () => ({ width: 1, height: 1 }),
    getState: () => ({}), applyState: () => {}, saveLocal: () => {}, refresh: () => {},
  });
  // ライブ配信（?presenter=1 / ?live=CODE / &rec=1 のときだけ有効）
  if (window.SlideLive) SlideLive.init({
    pageKey: STORAGE_KEY,
    getCanvas: () => $('drawCanvas'),
    getBoardCanvas: () => $('boardCanvas'),
    getCurrent: () => current,
    showSlide: i => showSlide(i),
    getStrokes: () => strokes[current] || [],
    getBoardStrokes: () => boardStrokes[current] || [],
    getPointer: () => pointerPos,
    isBoardOpen: () => boardOpen,
    setBoardOpen: on => setBoard(!!on),
    getMedia: () => null, setMedia: () => {},
    lineScale: w => w / REF_W,
    boardLineScale: w => w / BREF_W,
    recName: deck,
  });
}

// PDF のしおり（Beamer の \section など）→ セクション
async function readOutline() {
  try {
    const ol = await pdf.getOutline(); if (!ol) return [];
    const out = [];
    for (const it of ol) {
      let dest = it.dest;
      if (typeof dest === 'string') dest = await pdf.getDestination(dest);
      if (!Array.isArray(dest) || !dest[0]) continue;
      out.push({ title: it.title, slide: await pdf.getPageIndex(dest[0]) });
    }
    return out.sort((a, b) => a.slide - b.slide);
  } catch (e) { return []; }
}
function fillSections() {
  const sel = $('secSel');
  if (!SECTIONS.length) { sel.hidden = true; return; }
  sel.innerHTML = SECTIONS.map(s => `<option value="${s.slide}">${s.title.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</option>`).join('');
  sel.hidden = false;
  sel.onchange = () => showSlide(parseInt(sel.value, 10));
}

/* ── 表示 ───────────────────────────────────────────────────────────────── */
function sizeStage() {
  const area = $('stageArea'), st = $('stage');
  const aw = area.clientWidth - 24, ah = area.clientHeight - 24;
  const w = Math.max(120, Math.min(aw, ah / pageAspect)), h = w * pageAspect;
  st.style.width = w + 'px'; st.style.height = h + 'px';
  st.style.left = (area.clientWidth - w) / 2 + 'px'; st.style.top = Math.max(12, (area.clientHeight - h) / 2) + 'px';
  const dc = $('drawCanvas'), ch = Math.round(CW * pageAspect);
  if (dc.width !== CW || dc.height !== ch) { dc.width = CW; dc.height = ch; }
  redrawStrokes();
}
let renderSeq = 0, renderTask = null;
const off = document.createElement('canvas');
async function renderPage() {
  if (!pdf) return;
  const seq = ++renderSeq;
  const page = await pdf.getPage(current + 1);
  if (seq !== renderSeq) return;
  const vp1 = page.getViewport({ scale: 1 });
  const asp = vp1.height / vp1.width;
  if (Math.abs(asp - pageAspect) > 1e-3) { pageAspect = asp; sizeStage(); }
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const vp = page.getViewport({ scale: parseFloat($('stage').style.width) * dpr / vp1.width });
  if (renderTask) { try { renderTask.cancel(); } catch (e) {} }
  off.width = Math.round(vp.width); off.height = Math.round(vp.height);
  renderTask = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
  try { await renderTask.promise; } catch (e) { if (e && e.name !== 'RenderingCancelledException') console.warn(e); return; }
  if (seq !== renderSeq) return;
  const c = $('pdfCanvas');   // 描き終わってから差し替える（ページ送りで白く点滅しない）
  c.width = off.width; c.height = off.height; c.getContext('2d').drawImage(off, 0, 0);
  if (current + 1 < N) pdf.getPage(current + 2).catch(() => {});   // 次のページを先読み
}

function showSlide(i) {
  if (!pdf || i < 0 || i >= N) return;
  current = i; curStroke = null; pointerPos = null; boardCur = null;
  history.replaceState(null, '', location.pathname + location.search + '#' + (i + 1));
  $('pageInfo').textContent = `${i + 1} / ${N}`;
  $('boardPage').textContent = i + 1;
  if (SECTIONS.length) {
    let v = SECTIONS[0].slide;
    for (const s of SECTIONS) if (i >= s.slide) v = s.slide;
    $('secSel').value = String(v);
  }
  renderPage();
  redrawStrokes();
  redrawBoardStrokes();
  scheduleSave();
}
const nextSlide = () => showSlide(current + 1);
const prevSlide = () => showSlide(current - 1);

/* ── 描画（slide-live.js がこの 3 つを使う／包むのでグローバル関数のままにする）── */
function drawPointerMark(ctx, x, y) {
  const k = ctx.canvas.width / REF_W;
  ctx.beginPath(); ctx.arc(x, y, 12 * k, 0, Math.PI * 2); ctx.fillStyle = 'rgba(233,69,96,0.7)'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, 5 * k, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
}
function paint(ctx, list, k) {
  for (const s of list || []) {
    const p = s.points; if (!p || !p.length) continue;
    ctx.strokeStyle = s.color; ctx.lineWidth = s.size * k; ctx.globalAlpha = s.alpha || 1;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
    for (let j = 1; j < p.length; j++) ctx.lineTo(p[j].x, p[j].y);
    if (p.length === 1) ctx.lineTo(p[0].x + 0.01, p[0].y);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function redrawStrokes() {
  const c = $('drawCanvas'), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  paint(ctx, strokes[current], c.width / REF_W);
  if (pointerPos) drawPointerMark(ctx, pointerPos.x, pointerPos.y);
}
function redrawBoardStrokes() {
  const c = $('boardCanvas'), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  paint(ctx, boardStrokes[current], c.width / BREF_W);
}

/* ── 手書き（スライドの上）────────────────────────────────────────────────── */
function canvasPos(e, c) {
  const r = c.getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) / r.width * c.width * 10) / 10,
           y: Math.round((e.clientY - r.top) / r.height * c.height * 10) / 10 };
}
function setDraw(on) {
  drawMode = on;
  document.body.classList.toggle('drawing', on);
  $('drawBtn').classList.toggle('on', on);
  $('drawbar').classList.toggle('show', on);
  if (!on && pointerPos) { pointerPos = null; redrawStrokes(); }
}
function setTool(t) {
  drawTool = t;
  document.querySelectorAll('#drawbar [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  if (t !== 'pointer' && pointerPos) { pointerPos = null; redrawStrokes(); }
}
function setColor(c) { drawColor = c; document.querySelectorAll('#drawbar .sw').forEach(b => b.classList.toggle('on', b.dataset.c === c)); }
function eraseIn(store, pt, r, redraw) {
  const arr = store[current] || [];
  const keep = arr.filter(s => !s.points.some(p => Math.hypot(p.x - pt.x, p.y - pt.y) < r));
  if (keep.length !== arr.length) { store[current] = keep; redraw(); }
}
const stage = $('stage'), dcv = $('drawCanvas');
stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'pen') { penSeen = true; if (!drawMode) setDraw(true); }   // Pencil を当てたら自動で手書き
  if (!drawMode) return;
  if (e.pointerType === 'touch' && penSeen) return;     // Pencil 使用時は指で書かない（指はスワイプでページ送り）
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  const pt = canvasPos(e, dcv);
  if (drawTool === 'pointer') { pointerPos = pt; redrawStrokes(); curStroke = { pointer: true }; return; }
  if (drawTool === 'eraser') { curStroke = { eraser: true }; eraseIn(strokes, pt, 12 * CW / REF_W, redrawStrokes); return; }
  const hl = drawTool === 'highlight';
  curStroke = { color: drawColor, size: hl ? 9 : 3, alpha: hl ? 0.3 : 1, points: [pt] };
  (strokes[current] || (strokes[current] = [])).push(curStroke);
  redrawStrokes();
});
stage.addEventListener('pointermove', e => {
  if (!drawMode) return;
  if (drawTool === 'pointer') {
    if (e.pointerType === 'mouse' || e.pointerType === 'pen' || curStroke) { pointerPos = canvasPos(e, dcv); redrawStrokes(); }
    return;
  }
  if (!curStroke) return;
  e.preventDefault();
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (evs.length ? evs : [e])) {
    const pt = canvasPos(ev, dcv);
    if (curStroke.eraser) { eraseIn(strokes, pt, 12 * CW / REF_W, redrawStrokes); continue; }
    const last = curStroke.points[curStroke.points.length - 1];
    if (Math.abs(pt.x - last.x) + Math.abs(pt.y - last.y) < 1.5) continue;
    curStroke.points.push(pt);
  }
  if (!curStroke.eraser) redrawStrokes();
});
function endStroke(e) {
  if (drawTool === 'pointer' && e.pointerType !== 'mouse' && pointerPos) { pointerPos = null; redrawStrokes(); }
  if (curStroke && !curStroke.pointer) scheduleSave();
  curStroke = null;
}
stage.addEventListener('pointerup', endStroke);
stage.addEventListener('pointercancel', endStroke);
stage.addEventListener('pointerleave', () => { if (drawTool === 'pointer' && pointerPos) { pointerPos = null; redrawStrokes(); } });
function undoStroke() { (strokes[current] || []).pop(); redrawStrokes(); scheduleSave(); }
function clearStrokes() {
  if (!(strokes[current] || []).length || !confirm('このページの書き込みを全部消しますか？')) return;
  strokes[current] = []; redrawStrokes(); scheduleSave();
}

/* ── 板書（白紙のポップアップ。ページごとに別の板書）─────────────────────── */
function fitBoard() {
  const k = Math.min(1, innerWidth * 0.94 / 900, (innerHeight - 20) / 600);
  document.documentElement.style.setProperty('--board-scale', String(Math.round(k * 1000) / 1000));
}
function setBoard(on) {
  if (on === boardOpen) return;
  boardOpen = on; boardCur = null;
  $('board').classList.toggle('show', on);
  $('boardBtn').classList.toggle('on', on);
  if (on) { fitBoard(); redrawBoardStrokes(); }
}
function setBoardColor(c) {
  boardColor = c; boardEraser = false; $('bEraseBtn').classList.remove('on');
  document.querySelectorAll('#boardHead .sw').forEach(b => b.classList.toggle('on', b.dataset.bc === c));
}
const bcv = $('boardCanvas');
bcv.width = BW; bcv.height = BH;
let bPenSeen = false;
bcv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'pen') bPenSeen = true;
  if (e.pointerType === 'touch' && bPenSeen) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { bcv.setPointerCapture(e.pointerId); } catch (err) {}
  const pt = canvasPos(e, bcv);
  if (boardEraser) { boardCur = { eraser: true }; eraseIn(boardStrokes, pt, 14 * BW / BREF_W, redrawBoardStrokes); return; }
  boardCur = { color: boardColor, size: 3, alpha: 1, points: [pt] };
  (boardStrokes[current] || (boardStrokes[current] = [])).push(boardCur);
  redrawBoardStrokes();
});
bcv.addEventListener('pointermove', e => {
  if (!boardCur) return;
  e.preventDefault();
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (evs.length ? evs : [e])) {
    const pt = canvasPos(ev, bcv);
    if (boardCur.eraser) { eraseIn(boardStrokes, pt, 14 * BW / BREF_W, redrawBoardStrokes); continue; }
    const last = boardCur.points[boardCur.points.length - 1];
    if (Math.abs(pt.x - last.x) + Math.abs(pt.y - last.y) < 1.5) continue;
    boardCur.points.push(pt);
  }
  if (!boardCur.eraser) redrawBoardStrokes();
});
const endBoard = () => { if (boardCur) scheduleSave(); boardCur = null; };
bcv.addEventListener('pointerup', endBoard);
bcv.addEventListener('pointercancel', endBoard);
$('board').addEventListener('pointerdown', e => { if (e.target === $('board')) setBoard(false); });
$('bEraseBtn').onclick = () => { boardEraser = !boardEraser; $('bEraseBtn').classList.toggle('on', boardEraser); };
$('bUndoBtn').onclick = () => { (boardStrokes[current] || []).pop(); redrawBoardStrokes(); scheduleSave(); };
$('bClearBtn').onclick = () => {
  if (!(boardStrokes[current] || []).length || !confirm('この板書を全部消しますか？')) return;
  boardStrokes[current] = []; redrawBoardStrokes(); scheduleSave();
};
$('bCloseBtn').onclick = () => setBoard(false);
document.querySelectorAll('#boardHead .sw').forEach(b => b.onclick = () => setBoardColor(b.dataset.bc));

/* ── 保存（この端末の localStorage にだけ）──────────────────────────────── */
let saveTimer = null;
function saveLocal() {
  if (!STORAGE_KEY) return;
  ls.set(STORAGE_KEY, JSON.stringify({ v: 1, cw: CW, strokes, boardStrokes, lastSlide: current, updatedAt: Date.now() }));
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveLocal, 800); }
function loadLocal() {
  try {
    const d = JSON.parse(ls.get(STORAGE_KEY) || 'null'); if (!d) return;
    if (d.strokes) strokes = d.strokes;
    if (d.boardStrokes) boardStrokes = d.boardStrokes;
    if (typeof d.lastSlide === 'number') current = d.lastSlide;
  } catch (e) {}
}

/* ── 操作 ───────────────────────────────────────────────────────────────── */
$('prevBtn').onclick = prevSlide;
$('nextBtn').onclick = nextSlide;
$('drawBtn').onclick = () => setDraw(!drawMode);
$('boardBtn').onclick = () => setBoard(!boardOpen);
document.querySelectorAll('#drawbar [data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('#drawbar .sw').forEach(b => b.onclick = () => setColor(b.dataset.c));
$('undoBtn').onclick = undoStroke;
$('clearBtn').onclick = clearStrokes;
setTool('pen'); setColor('#e94560'); setBoardColor('#1f2937');
const fsEl = document.documentElement;
if (fsEl.requestFullscreen && document.fullscreenEnabled) {
  $('fsBtn').hidden = false;
  $('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : fsEl.requestFullscreen().catch(() => {});
}

document.addEventListener('keydown', e => {
  if (!pdf || (e.target.closest && e.target.closest('input, textarea, select'))) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault(); boardOpen ? $('bUndoBtn').onclick() : undoStroke(); return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape' && boardOpen) setBoard(false);
  else if (k === 'b' || k === 'B') setBoard(!boardOpen);
  else if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !drawMode)) { e.preventDefault(); nextSlide(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prevSlide(); }
  else if (k === 'Home') showSlide(0);
  else if (k === 'End') showSlide(N - 1);
  else if (k === 'f' || k === 'F') { if (!$('fsBtn').hidden) $('fsBtn').onclick(); }
  else if (k === 'd' || k === 'D') setDraw(!drawMode);
  else if (drawMode && (k === 'p' || k === 'P')) setTool('pen');
  else if (drawMode && (k === 'h' || k === 'H')) setTool('highlight');
  else if (drawMode && (k === 'e' || k === 'E')) setTool('eraser');
  else if (drawMode && (k === 'l' || k === 'L')) setTool('pointer');
});
// スワイプでページ送り（手書き中は、Pencil 使用時の指だけ）
let tx = 0, ty = 0, tSingle = false, tStylus = false;
$('stageArea').addEventListener('touchstart', e => {
  tSingle = e.touches.length === 1; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  tStylus = e.touches[0].touchType === 'stylus';
}, { passive: true });
$('stageArea').addEventListener('touchmove', e => { if (e.touches.length > 1) tSingle = false; }, { passive: true });
$('stageArea').addEventListener('touchend', e => {
  if (!pdf || !tSingle || tStylus || (drawMode && !penSeen)) return;
  if (window.visualViewport && window.visualViewport.scale > 1.05) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) dx > 0 ? prevSlide() : nextSlide();
});
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!pdf) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { sizeStage(); renderPage(); fitBoard(); }, 120);
});
window.addEventListener('pagehide', saveLocal);

/* ── 起動 ───────────────────────────────────────────────────────────────── */
(function start() {
  if (!window.pdfjsLib) { $('opener').hidden = false; alert('PDF.js を読み込めませんでした（ネットワークを確認してください）'); return; }
  const file = params.get('file');
  if (file) {
    if (/^[a-z]+:|^\/\/|\.\./i.test(file)) { alert('このリポジトリ内の PDF だけ開けます'); $('opener').hidden = false; return; }
    openPdf(file, file.split('/').pop(), true); return;
  }
  const op = $('opener'); op.hidden = false;
  const openLocal = async f => { if (f) openPdf({ data: new Uint8Array(await f.arrayBuffer()) }, f.name, false); };
  $('pdfInput').onchange = e => openLocal(e.target.files[0]);
  op.addEventListener('dragover', e => { e.preventDefault(); op.classList.add('drag'); });
  op.addEventListener('dragleave', () => op.classList.remove('drag'));
  op.addEventListener('drop', e => { e.preventDefault(); op.classList.remove('drag'); openLocal(e.dataTransfer.files[0]); });
})();
</script>
</body>
</html>
