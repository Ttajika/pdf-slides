<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFスライド</title>
<!--
  viewer.html — GitHub に置いた PDF をスライドとして表示し、手書き・板書を iPad → PC へライブ配信する

    普通に見る:      viewer.html?file=pdf/xxx.pdf             （#5 で 5 ページ目から）
    配信（iPad）:    viewer.html?file=pdf/xxx.pdf&presenter=1&live=CODE   要ログイン
    受信（PC）:      viewer.html?file=pdf/xxx.pdf&live=CODE
    受信＋録画（PC）: viewer.html?file=pdf/xxx.pdf&live=CODE&rec=1

  ?file を付けずに開くと、手元の PDF を選んで開ける（配信はできない。確認用）。

  座標の決まり（js/slide-live.js と合わせる）:
    ・手書き canvas の内部解像度は幅 CW px に固定（高さ = CW × ページの縦横比）。点はこの px で持つ
    ・板書 canvas は BW × BH px に固定
    ・線の太さ size は「スライド幅 1100px / 板書幅 900px のときの px」。描くときに倍率を掛ける
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/slide-sync.js"></script>
<script src="js/slide-live.js"></script>
<script src="js/slide-share.js"></script>
<style>
:root { --accent:#e94560; --bar:#1a1a2e; --bg:#eef0f3; --ink:#1f2937; --muted:#6b7280; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.ic { width:1em; height:1em; vertical-align:-0.125em; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; }
.topbar { position:fixed; top:0; left:0; right:0; height:46px; display:flex; align-items:center; gap:10px;
  padding:0 12px; background:var(--bar); color:#fff; z-index:100; }
.topbar a.home { color:#fff; opacity:.75; text-decoration:none; font-size:15px; }
.topbar-title { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.topbar-nav { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.nav-btn, .nav-sel { font:inherit; font-size:13px; color:#fff; background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2); border-radius:5px; padding:4px 9px; cursor:pointer; line-height:1.3; }
.nav-sel { max-width:180px; }
.nav-sel option { color:#000; }
.nav-btn.on { background:var(--accent); border-color:var(--accent); }
#pageInfo { font-size:13px; font-variant-numeric:tabular-nums; min-width:5.5em; text-align:center; }
.topbar a.home .ic, .nav-btn .ic { width:16px; height:16px; }
#drawbar { position:fixed; top:54px; left:12px; z-index:90; display:none; flex-wrap:wrap; gap:6px 10px; align-items:center;
  max-width:calc(100vw - 24px); background:rgba(26,26,46,.94); padding:6px 8px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.2); }
#drawbar.show { display:flex; }
#drawbar .grp { display:flex; gap:5px; align-items:center; }
#drawbar .grp + .grp { padding-left:10px; border-left:1px solid rgba(255,255,255,.18); }
#drawbar button { font:inherit; font-size:13px; background:rgba(255,255,255,.1); color:#fff; line-height:0;
  border:1px solid rgba(255,255,255,.25); border-radius:6px; padding:6px 8px; cursor:pointer; }
#drawbar button .ic { width:17px; height:17px; }
#drawbar button.on { background:#fff; color:var(--bar); }
#ptrShapes { display:none !important; }
#drawbar.ptr #ptrShapes { display:flex !important; }
#drawbar.ptr #penActs { display:none; }
.sw { width:22px; height:22px; padding:0 !important; border-radius:50% !important; border:2px solid rgba(255,255,255,.4) !important; cursor:pointer; }
.sw.on { border-color:#fff !important; outline:2px solid #fff; }
.sw.custom { position:relative; overflow:hidden; display:inline-block;
  background:conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899,#ef4444); }
.sw.custom input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; }
#boardHead button { line-height:0; }
#boardHead button .ic { width:15px; height:15px; }
#stageArea { position:absolute; top:46px; left:0; right:0; bottom:0; }
#stage { position:absolute; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.15); }
#stage canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
#pdfCanvas { z-index:0; }
#drawCanvas { z-index:10; pointer-events:none; }
body.drawing #drawCanvas { pointer-events:auto; cursor:crosshair; }
body.drawing #stage { touch-action:none; }
/* 板書ポップアップ（900×600 固定。画面に収まらない分は transform で縮める）*/
#board { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:300; }
#board.show { display:block; }
#boardInner { position:absolute; left:50%; top:50%; width:900px; height:600px; background:#fff; border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.3); overflow:hidden; transform:translate(-50%,-50%) scale(var(--board-scale,1)); }
#boardHead { height:40px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 14px;
  background:var(--bar); color:#fff; font-size:13px; }
#boardHead .tools { display:flex; gap:6px; align-items:center; }
#boardHead button { font:inherit; font-size:13px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
  color:#fff; border-radius:5px; cursor:pointer; padding:3px 8px; }
#boardHead button.on { background:#fff; color:var(--bar); }
#boardWrap { position:relative; width:900px; height:560px; touch-action:none; }
#boardWrap canvas { position:absolute; top:0; left:0; width:100%; height:100%; cursor:crosshair; }
#opener { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; }
#opener .box { background:#fff; border:2px dashed #c7cbd3; border-radius:14px; padding:32px 28px; max-width:460px;
  text-align:center; line-height:1.8; }
#opener.drag .box { border-color:var(--accent); background:#fff5f7; }
#opener h1 { font-size:18px; margin:0 0 6px; }
#opener label { display:inline-block; margin-top:10px; background:var(--accent); color:#fff; border-radius:8px;
  padding:9px 18px; cursor:pointer; font-weight:700; }
#opener .note { font-size:12.5px; color:var(--muted); margin-top:12px; }
#opener a { color:var(--accent); }
#loading { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); background:rgba(26,26,46,.9); color:#fff;
  padding:10px 18px; border-radius:8px; font-size:14px; display:none; z-index:50; }
#loading.show { display:block; }
#shareOverlay { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.5); align-items:center; justify-content:center; }
#shareOverlay.open { display:flex; }
.sh-modal { background:#fff; color:#1f2937; border-radius:12px; padding:20px; width:min(420px,92vw); max-height:92vh; overflow:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.3); font-size:14px; line-height:1.6; -webkit-user-select:text; user-select:text; }
.sh-modal h3 { margin:0 0 10px; font-size:16px; }
.sh-label { font-size:12.5px; color:var(--muted); margin-top:12px; }
.sh-url { font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; background:#f3f4f6; padding:8px; border-radius:6px; margin:4px 0; }
.sh-qr { text-align:center; } .sh-qr svg { width:150px; height:150px; }
.sh-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.sh-btns button, .sh-file { flex:1; font:inherit; font-size:14px; padding:8px 12px; border-radius:8px; cursor:pointer; text-align:center;
  border:1px solid #d1d5db; background:#f3f4f6; color:#1f2937; }
.sh-btns button.danger { background:#fff; color:#dc2626; border-color:#fca5a5; }
.sh-check { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:13.5px; cursor:pointer; }
.sh-msg { margin-top:8px; font-size:13px; min-height:1.3em; }
@media (max-width: 760px) {
  .topbar-title { display:none; }
  .nav-sel { max-width:110px; }
}

<script>
'use strict';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const REF_W = 1100;            // 線の太さ・ポインターの大きさの基準幅（HTML スライドと同じ）
const CW = 2200;               // 手書き canvas の内部幅（px）
const BREF_W = 900, BW = 1800, BH = 1120;   // 板書：基準幅 / canvas の内部サイズ（表示は 900×560）
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let pdf = null, N = 0, current = 0, SECTIONS = [];
let pageAspect = 9 / 16;       // 高さ / 幅
let strokes = {}, boardStrokes = {};   // { ページ番号: [{color,size,alpha,points:[{x,y}]}] }（canvas の px）
let STORAGE_KEY = '', deck = '';
let drawMode = false, drawTool = 'pen', drawColor = '#e94560', penSeen = false, curStroke = null, pointerPos = null;
let boardOpen = false, boardColor = '#1f2937', boardEraser = false, boardCur = null;

function loading(msg) { const el = $('loading'); el.textContent = msg; el.classList.toggle('show', !!msg); }
const deckName = name => name.replace(/\.pdf$/i, '').replace(/[\\/:*?"<>|#%&\s]+/g, '_');

/* ── PDF を開く ──────────────────────────────────────────────────────────── */
// live: null（配信しない）| { storageKey?, ...SlideLive に渡す追加の adapter }
async function openPdf(src, fileName, live) {
  $('opener').hidden = true;
  loading('PDF を読み込み中…');
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    pdf = await pdfjsLib.getDocument(src).promise;
  } catch (e) {
    loading(''); $('opener').hidden = false;
    alert('PDF を開けませんでした：' + (e && e.message || e)); return;
  }
  N = pdf.numPages;
  deck = deckName(fileName);
  dlName = fileName.replace(/[\\/:*?"<>|]+/g, '_');
  document.title = fileName.replace(/\.pdf$/i, '');
  $('title').textContent = document.title;
  STORAGE_KEY = (live && live.storageKey) || 'pdfslides_' + deck;
  SECTIONS = await readOutline();
  fillSections();
  loadLocal();
  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= N) current = h - 1;
  current = Math.max(0, Math.min(N - 1, current));
  const first = await pdf.getPage(current + 1);
  const vp = first.getViewport({ scale: 1 }); pageAspect = vp.height / vp.width;
  loading('');
  $('stage').hidden = false;
  sizeStage();
  showSlide(current);
  if (!live) return;   // 手元の PDF は配信しない（受信側が同じ PDF を開けないため）

  // ライブ配信（GitHub の PDF：?presenter=1 / ?live=CODE / &rec=1 のとき。共有リンク：常に）
  const { storageKey, ...extra } = live;
  if (window.SlideLive) SlideLive.init(Object.assign({
    pageKey: STORAGE_KEY,
    getCanvas: () => $('drawCanvas'),
    getBoardCanvas: () => $('boardCanvas'),
    getCurrent: () => current,
    showSlide: i => showSlide(i),
    getStrokes: () => strokes[current] || [],
    getBoardStrokes: () => boardStrokes[current] || [],
    getPointer: () => pointerPos,
    getPointerStyle: ptrStyle,
    isBoardOpen: () => boardOpen,
    setBoardOpen: on => setBoard(!!on),
    getMedia: () => null, setMedia: () => {},
    lineScale: w => w / REF_W,
    boardLineScale: w => w / BREF_W,
    recName: deck,
  }, extra));
}

// ダウンロード：読み込み済みの PDF をそのまま保存（別オリジンでも a[download] が効くよう Blob にする）

    // この端末に発表者リンクの控えを残す（upload.html の一覧に出る）
    SlideShare.remember({ id, key, title: info.title, expires: info.expires });
    injectSharePanel();
  }
  const L = SlideShare.links(id, null);
  setDownloadable(isPresenter || info.allowDownload);
  await openPdf(info.url, (info.title || 'slides') + '.pdf', {
    storageKey: 'pdfslides_s_' + id,
    role: isPresenter ? 'presenter' : 'viewer',
    canPresent: () => isPresenter,
    viewerUrl: withRec => withRec ? L.record : L.share,
    showShare: isPresenter ? openSharePanel : undefined,
  });
}
function showGone(msg) {
  const op = $('opener'); op.hidden = false;
  op.querySelector('.box').innerHTML = `<h1>スライドを開けません</h1><div>${msg.replace(/</g, '&lt;')}</div>
    <div class="note">発表者に新しいリンクをもらってください。</div>`;
}
function injectSharePanel() {
  // 開くのはトップバーの QR ボタン（slide-live.js が作る。adapter.showShare）
  const ov = document.createElement('div');
  ov.id = 'shareOverlay';
  ov.innerHTML = `<div class="sh-modal">
    <h3>共有・管理</h3>
    <div class="sh-label">共有リンク（参加者向け。配信中はそのまま追従します）</div>
    <div class="sh-url" id="shUrl"></div>
    <div class="sh-btns"><button id="shCopy">コピー</button></div>
    <div class="sh-qr" id="shQr"></div>
    <label class="sh-check"><input type="checkbox" id="shDl"> 参加者に PDF のダウンロードを許可する</label>
    <div class="sh-label">有効期限：<strong id="shExp"></strong></div>
    <div class="sh-btns"><button id="shExtend">今から 30 日に延長</button></div>
    <div class="sh-label">PDF を差し替える（共有リンクはそのまま。開いている人は再読み込みで新しい版になります）</div>
    <div class="sh-btns"><label class="sh-file">PDF を選ぶ<input type="file" id="shFile" accept="application/pdf,.pdf" hidden></label></div>
    <div class="sh-msg" id="shMsg"></div>
    <div class="sh-btns" style="margin-top:16px;">
      <button id="shDelete" class="danger">削除する</button><button id="shClose">閉じる</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });
  const msg = (t, err) => { $('shMsg').textContent = t || ''; $('shMsg').style.color = err ? '#dc2626' : ''; };
  $('shClose').onclick = () => ov.classList.remove('open');
  $('shCopy').onclick = async () => { await SlideShare.copy(SlideShare.links(share.id).share); msg('コピーしました'); };
  $('shDl').onchange = async e => {
    const on = e.target.checked;
    try { await SlideShare.setDownload(share.id, share.key, on); share.allowDownload = on;
      msg(on ? '参加者がダウンロードできるようにしました' : '参加者のダウンロードボタンを隠しました（開いている人は再読み込みで反映）'); }
    catch (err) { e.target.checked = !on; msg(err.message, true); }
  };
  $('shExtend').onclick = async () => {
    try { share.expires = await SlideShare.extend(share.id, share.key); fillSharePanel(); msg('延長しました');
      SlideShare.remember({ id: share.id, key: share.key, title: share.title, expires: share.expires }); }
    catch (e) { msg(e.message, true); }
  };
  $('shFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    msg('アップロード中…');
    try {
      await SlideShare.replace(share.id, share.key, f, '');
      const info = await SlideShare.get(share.id);
      msg('差し替えました'); await reloadPdf(info.url);
    } catch (err) { msg(err.message, true); }
  };
  $('shDelete').onclick = async () => {
    if (!confirm('このスライドを削除しますか？\n共有リンク・発表者リンクとも使えなくなります。')) return;
    try { await SlideShare.remove(share.id, share.key); SlideShare.forget(share.id); alert('削除しました'); location.href = './upload.html'; }
    catch (e) { msg(e.message, true); }
  };
}
function fillSharePanel() {
  const url = SlideShare.links(share.id).share;
  $('shUrl').textContent = url;
  $('shQr').innerHTML = SlideShare.qrSvg(url);
  $('shExp').textContent = SlideShare.fmtDate(share.expires);
  $('shDl').checked = share.allowDownload !== false;
}
function openSharePanel() { fillSharePanel(); $('shMsg').textContent = ''; $('shareOverlay').classList.add('open'); }

/* ── 起動 ───────────────────────────────────────────────────────────────── */
(function start() {
  if (!window.pdfjsLib) { $('opener').hidden = false; alert('PDF.js を読み込めませんでした（ネットワークを確認してください）'); return; }
  const file = params.get('file'), sid = params.get('s');
  const syncInit = loginButton => window.SlideSync && SlideSync.init({
    storageKey: 'pdfslides_login', syncData: false, loginButton,   // ログインは配信者の確認だけ。書き込みは同期しない
    getCanvas: () => ({ width: 1, height: 1 }),
    getState: () => ({}), applyState: () => {}, saveLocal: () => {}, refresh: () => {},
  });
  if (sid) { syncInit(false); openShared(sid, params.get('k')); return; }
  if (file) {
    if (/^[a-z]+:|^\/\/|\.\./i.test(file)) { alert('このリポジトリ内の PDF だけ開けます'); $('opener').hidden = false; return; }
    syncInit(params.has('presenter'));
    setDownloadable(true);
    openPdf(file, file.split('/').pop(), {}); return;
  }
  const op = $('opener'); op.hidden = false;
  const openLocal = async f => { if (f) openPdf({ data: new Uint8Array(await f.arrayBuffer()) }, f.name, false); };
  $('pdfInput').onchange = e => openLocal(e.target.files[0]);
  op.addEventListener('dragover', e => { e.preventDefault(); op.classList.add('drag'); });
  op.addEventListener('dragleave', () => op.classList.remove('drag'));
  op.addEventListener('drop', e => { e.preventDefault(); op.classList.remove('drag'); openLocal(e.dataTransfer.files[0]); });
})();
</script>
</body>
